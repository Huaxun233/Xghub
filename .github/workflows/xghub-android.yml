name: Build Xghub signed APK
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  PACKAGE_NAME: xyz.aokorin.xghub
  BUNDLED_MODULES: bundled-modules/aigo,bundled-modules/kanju
  PYTHONUTF8: '1'
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Huaxun233/aigo-module
          path: bundled-modules/aigo
      - uses: actions/checkout@v4
        with:
          repository: Huaxun233/kanju-module
          path: bundled-modules/kanju
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36"
          accept-android-sdk-licenses: true
      - run: sdkmanager 'ndk;28.2.13676358'
      - name: Set up Rust for Android
        run: |
          rustup toolchain install 1.95 --profile minimal
          rustup default 1.95
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "未配置签名 Secrets，拒绝发布 debug 签名的 APK。" >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - run: python scripts/build_android.py
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      - name: 校验 APK 签名证书
        shell: bash
        env:
          CERT_SHA256: ${{ vars.SIGNING_CERT_SHA256 }}
          CERT_VARIABLE: SIGNING_CERT_SHA256
        run: |
          set -euo pipefail
          expected=$(printf '%s' "$CERT_SHA256" | tr -d ': ' | tr '[:upper:]' '[:lower:]')
          if [ -z "$expected" ]; then
            echo "未设置仓库变量 $CERT_VARIABLE，无法确认发布证书。" >&2
            exit 1
          fi
          apksigner=$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f 2>/dev/null | sort | tail -n1 || true)
          if [ -z "$apksigner" ]; then
            sdkmanager 'build-tools;35.0.0' >/dev/null
            apksigner=$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort | tail -n1)
          fi
          echo "apksigner：$apksigner"
          "$apksigner" --version || true
          for apk in dist/android/*.apk; do
            echo "== $(basename "$apk")"
            output=$("$apksigner" verify --print-certs "$apk" 2>&1 || true)
            printf '%s\n' "$output"
            if ! printf '%s' "$output" | tr -d ':' | tr '[:upper:]' '[:lower:]' | grep "$expected" >/dev/null; then
              echo "签名证书与发布证书不一致，已终止。" >&2
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/android/*
          if-no-files-found: error
          retention-days: 14
