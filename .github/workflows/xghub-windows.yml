name: Build Xghub Windows
on:
  push:
    branches: [codex/guoapp-client]
  workflow_dispatch:
permissions:
  contents: read
env:
  PACKAGE_NAME: xyz.aokorin.xghub
  BUNDLED_MODULES: bundled-modules/hongguo
  PYTHONUTF8: '1'
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: guoapp-modules/hongguo
          path: bundled-modules/hongguo
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Set up Rust and NuGet
        shell: pwsh
        run: |
          rustup toolchain install 1.95 --profile minimal
          rustup default 1.95
          if (-not (Get-Command nuget -ErrorAction SilentlyContinue)) {
            choco install nuget.commandline --no-progress -y
          }
      - name: Set up MinGW-w64
        shell: pwsh
        run: |
          choco install mingw --no-progress -y
          $exe = Get-ChildItem -Path 'C:\ProgramData\mingw64', 'C:\ProgramData\chocolatey\lib\mingw' `
                   -Recurse -Include 'x86_64-w64-mingw32-gcc.exe', 'gcc.exe' -ErrorAction SilentlyContinue |
                 Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) { $exe = (Get-Command x86_64-w64-mingw32-gcc -ErrorAction SilentlyContinue).Source }
          if (-not $exe) { throw 'MinGW-w64 安装失败，找不到 gcc' }
          Split-Path $exe | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $exe --version | Select-Object -First 1
      - name: Set up Inno Setup
        shell: pwsh
        run: choco upgrade innosetup --no-progress -y
      - run: python scripts/build_windows.py
      - name: Verify the embedded comics runtime and HTTP image loading
        shell: pwsh
        run: |
          $runtime = (Resolve-Path 'build/windows/x64/runner/Release').Path
          $env:Path = "$runtime;$env:Path"
          flutter test --no-pub --dart-define=XGHUB_NATIVE_COMICS_TEST=true --dart-define=XGHUB_COMICS_HTTP_TEST=true test/comics_source_runtime_test.dart test/comics_integration_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/windows/*
          if-no-files-found: error
          retention-days: 14

